name: Publish Elsewhere assets

on:
  push:
    branches: [gh-pages]
    paths:
      - 'elsewhere/.asset-src/**'
      - '.github/workflows/build-elsewhere-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Rebuild optimized assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p elsewhere/public/assets
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            cat elsewhere/.asset-src/"$name".part* | base64 --decode > elsewhere/public/assets/"$name"
          done < elsewhere/.asset-src/assets.list
          rm -rf elsewhere/.asset-src
          rm -f .github/workflows/build-elsewhere-assets.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A elsewhere .github/workflows/build-elsewhere-assets.yml
          git commit -m "Publish Elsewhere optimized assets [skip ci]"
          git push origin gh-pages
